<!DOCTYPE html>
<html>
<head>
  <title>My Platform Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      margin: auto;
      background: linear-gradient(#87ceeb 70%, #5fbd4f 70%);
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px #000;
    }
  </style>
</head>

<body>

<div id="info">Coins: <span id="score">0</span></div>

<canvas id="game" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let score = 0;
let gameOver = false;

const player = {
  x: 100,
  y: 350,
  width: 35,
  height: 45,
  vx: 0,
  vy: 0,
  speed: 5,
  jump: -13,
  grounded: false
};

const keys = {};

document.addEventListener("keydown", e => {
  keys[e.key] = true;

  if (e.key === " " && player.grounded) {
    player.vy = player.jump;
    player.grounded = false;
  }
});

document.addEventListener("keyup", e => {
  keys[e.key] = false;
});

const platforms = [
  { x: 0, y: 450, width: 900, height: 50 },
  { x: 250, y: 360, width: 150, height: 20 },
  { x: 500, y: 300, width: 150, height: 20 },
  { x: 720, y: 370, width: 120, height: 20 }
];

const coins = [
  { x: 300, y: 320, collected: false },
  { x: 550, y: 260, collected: false },
  { x: 760, y: 330, collected: false }
];

const enemies = [
  {
    x: 600,
    y: 410,
    width: 35,
    height: 35,
    vx: 2
  }
];
