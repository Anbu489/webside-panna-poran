<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Push-Up Counter & Rewards</title>
    <!-- MediaPipe & TensorFlow Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #818cf8;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .dashboard-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        .stat-card {
            flex: 1;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #334155;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .camera-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        #video-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            margin-top: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            background: #334155;
        }

        .status-badge.correct { background: var(--accent-green); color: black; }
        .status-badge.incorrect { background: var(--accent-red); color: white; }

        .rewards-shop {
            flex: 1;
            min-width: 300px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }

        .rewards-shop h2 {
            font-size: 1.3rem;
            color: #a5b4fc;
            margin-bottom: 15px;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #334155;
        }

        .shop-item button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .shop-item button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .btn-start {
            background: var(--accent-green);
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏋️ AI Push-Up Counter & Rewards</h1>
        <p>கேமரா முன்னாடி சரியா புஷ்-அப் பண்ணுங்க, ரிவார்ட்ஸ் ஜெயிங்க!</p>
    </header>

    <div class="dashboard-stats">
        <div class="stat-card">
            <h3>புஷ்-அப்கள் (Reps)</h3>
            <div class="value" id="rep-count">0</div>
        </div>
        <div class="stat-card">
            <h3>நாணயங்கள் (Coins)</h3>
            <div class="value" id="coin-count">0 🪙</div>
        </div>
    </div>

    <div class="main-container">
        <!-- Camera Area -->
        <div class="camera-box">
            <div id="video-container">
                <video id="video" playsinline></video>
                <canvas id="output"></canvas>
            </div>
            <div id="status" class="status-badge">கேமராவை ஸ்டார்ட் செய்யவும்...</div>
            <button class="btn-start" onclick="startCamera()"> Start Workout</button>
        </div>

        <!-- Rewards Shop -->
        <div class="rewards-shop">
            <h2>🎁 ரிவார்ட் கடை (Rewards Shop)</h2>
            <div class="shop-item">
                <div>
                    <strong>Pro Fitness Badge</strong><br>
                    <small>50 Coins</small>
                </div>
                <button onclick="buyReward(50, 'Pro Fitness Badge')" id="btn-badge">வாங்கு</button>
            </div>
            <div class="shop-item">
                <div>
                    <strong>FreeFire Special Avatar</strong><br>
                    <small>100 Coins</small>
                </div>
                <button onclick="buyReward(100, 'FreeFire Avatar')" id="btn-avatar">வாங்கு</button>
            </div>
        </div>
    </div>

    <script>
        let reps = 0;
        let coins = parseInt(localStorage.getItem('user_coins')) || 0;
        let stage = 'up'; // 'up' or 'down'

        document.getElementById('coin-count').innerText = coins + ' 🪙';

        async function startCamera() {
            const video = document.getElementById('video');
            const status = document.getElementById('status');
            status.innerText = "கேமரா தயாராகிறது...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();

                status.innerText = "சரியான புஷ்-அப் பொசிஷனில் நிற்கவும்!";
                status.className = "status-badge correct";

                initPoseDetection(video);
            } catch (err) {
                alert("கேமரா அனுமதிக்கப்படவில்லை அல்லது இயங்கவில்லை!");
                status.innerText = "Camera Error!";
                status.className = "status-badge incorrect";
            }
        }

        async function initPoseDetection(video) {
            const detector = await poseDetection.createDetector(
                poseDetection.SupportedModels.MoveNet
            );

            async function detect() {
                const poses = await detector.estimatePoses(video);
                if (poses.length > 0) {
                    processPose(poses[0]);
                }
                requestAnimationFrame(detect);
            }
            detect();
        }

        function processPose(pose) {
            // Simple Logic using Shoulder & Elbow positions
            const keypoints = pose.keypoints;
            const leftShoulder = keypoints.find(k => k.name === 'left_shoulder');
            const leftElbow = keypoints.find(k => k.name === 'left_elbow');

            if (leftShoulder && leftElbow && leftShoulder.score > 0.4) {
                // Detecting Movement Down and Up
                if (leftShoulder.y > leftElbow.y - 20) {
                    if (stage === 'up') {
                        stage = 'down';
                    }
                }
                if (leftShoulder.y < leftElbow.y - 50 && stage === 'down') {
                    stage = 'up';
                    reps++;
                    coins += 5; // 5 coins per pushup
                    
                    document.getElementById('rep-count').innerText = reps;
                    document.getElementById('coin-count').innerText = coins + ' 🪙';
                    localStorage.setItem('user_coins', coins);

                    // Sound effect
                    let audio = new Audio('https://media.geeksforgeeks.org/wp-content/uploads/20190529122812/beep.mp3');
                    audio.play();
                }
            }
        }

        function buyReward(cost, name) {
            if (coins >= cost) {
                coins -= cost;
                localStorage.setItem('user_coins', coins);
                document.getElementById('coin-count').innerText = coins + ' 🪙';
                alert('வாழ்த்துக்கள்! ' + name + ' ரிவார்ட் பெறப்பட்டது! 🎉');
            } else {
                alert('போதிய நாணயங்கள் இல்லை! இன்னும் புஷ்-அப் செய்யுங்கள்!');
            }
        }
    </script>
</body>
</html>
